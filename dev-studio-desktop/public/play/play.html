<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dev Studio Arcade</title>
    <style>
      html, body { margin:0; height:100%; background:#0b0b0b; display:flex; align-items:center; justify-content:center; overflow:hidden; }
      canvas { max-width:100%; max-height:100%; }
    </style>
  </head>
  <body>
    <canvas id="game" width="960" height="540"></canvas>
    <script src="./engine.js"></script>
    <script src="./engine3d.js"></script>
    <script>
      const name = new URLSearchParams(location.search).get('g') || 'arena';
      const s = document.createElement('script');
      s.src = `./games/${encodeURIComponent(name).replace(/[^a-z0-9_-]/gi, '')}.js`;
      s.onerror = () => { document.body.innerHTML = '<p style="color:#f5f4f0;font-family:monospace">Unknown game. Use the buttons on the arcade page.</p>'; };
      document.body.appendChild(s);
    </script>
  </body>
</html>
